<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan de idiomas</title>
<meta name="description" content="Tu plan diario de árabe, alemán, inglés y francés.">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idiomas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Plan de idiomas</span></div>
      <span id="sync" class="sync" role="status" aria-live="polite">Cargando…</span>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section id="v-login" class="view" hidden></section>
    <section id="v-hoy" class="view" hidden></section>
    <section id="v-plan" class="view" hidden></section>
    <section id="v-resumen" class="view" hidden></section>
    <section id="v-ajustes" class="view" hidden></section>
  </main>

  <nav class="tabs" id="tabs" aria-label="Secciones" hidden>
    <button type="button" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Hoy</span></button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M4 12h14M4 18h6"/></svg><span>Plan</span></button>
    <button type="button" data-tab="resumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-6"/></svg><span>Resumen</span></button>
    <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Ajustes</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<noscript><p style="padding:24px">Esta app necesita JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
